name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Real Postgres + pgvector for test/db (RLS, rate-limit atomicity, SQL functions).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npx vitest run

      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Placeholder values: no real Supabase project is contacted during a
      # build. These only exist to satisfy src/lib/env.ts's required-var
      # checks, which run when /login prerenders statically at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
